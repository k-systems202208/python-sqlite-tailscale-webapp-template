[project]
name = "python-sqlite-tailscale-webapp-template"
version = "0.2.0"
description = "Reusable closed local web app template using Python, SQLite, and Tailscale Serve"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "backups", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["app", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
