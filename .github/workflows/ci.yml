name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell scripts and encoding
        shell: pwsh
        run: |
          $setupPath = (Resolve-Path "./scripts/setup-github.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($setupPath)

          if (
            $bytes.Length -lt 3 -or
            $bytes[0] -ne 0xEF -or
            $bytes[1] -ne 0xBB -or
            $bytes[2] -ne 0xBF
          ) {
            Write-Error "scripts/setup-github.ps1 must be UTF-8 with BOM for Windows PowerShell 5.1 compatibility."
            exit 1
          }

          $hasErrors = $false
          Get-ChildItem "./scripts" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $hasErrors = $true
              $parseErrors | ForEach-Object {
                Write-Error "$($_.Extent.File): $($_.Message)"
              }
            }
          }

          if ($hasErrors) {
            exit 1
          }

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Diagnose template environment
        run: python -m scripts.doctor

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Test with coverage
        run: >-
          python -m pytest
          --cov=app
          --cov=scripts.db_tools
          --cov-report=term-missing
          --cov-fail-under=80

  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate scripts and smoke test setup-github.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "This test must run on Windows PowerShell 5.1."
          }

          Get-ChildItem ".\scripts" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "$($_.Name): $($parseErrors[0].Message)"
            }
          }

          $global:MockRulesetExists = $false
          $global:MockPostCount = 0
          $global:MockPutCount = 0
          $global:LASTEXITCODE = 0

          function global:gh {
            $arguments = @($args)
            $global:LASTEXITCODE = 0

            if (
              $arguments.Count -ge 2 -and
              $arguments[0] -eq "auth" -and
              $arguments[1] -eq "status"
            ) {
              return
            }

            if ($arguments.Count -eq 0 -or $arguments[0] -ne "api") {
              throw "Unexpected gh call: $($arguments -join ' ')"
            }

            $endpoint = @(
              $arguments | Where-Object {
                $_ -is [string] -and $_ -like "repos/*"
              }
            ) | Select-Object -Last 1

            if ($endpoint -eq "repos/mock-owner/mock-repo") {
              if ($arguments -contains "--jq") {
                $jqIndex = [Array]::IndexOf($arguments, "--jq")
                $jq = [string]$arguments[$jqIndex + 1]

                if ($jq -eq ".permissions.admin") {
                  return "true"
                }

                if ($jq -eq '{allow_squash_merge,allow_merge_commit,allow_rebase_merge,delete_branch_on_merge,allow_update_branch}') {
                  return '{"allow_squash_merge":true,"allow_merge_commit":false,"allow_rebase_merge":false,"delete_branch_on_merge":true,"allow_update_branch":true}'
                }
              }

              return '{}'
            }

            if ($endpoint -eq "repos/mock-owner/mock-repo/rulesets") {
              if ($arguments -contains "--method") {
                $methodIndex = [Array]::IndexOf($arguments, "--method")
                $method = [string]$arguments[$methodIndex + 1]

                if ($method -eq "POST") {
                  $global:MockRulesetExists = $true
                  $global:MockPostCount++
                  return '{"id":123,"name":"Protect main","enforcement":"active"}'
                }
              }

              if ($global:MockRulesetExists) {
                return '[{"id":123,"name":"Protect main","enforcement":"active"}]'
              }

              return '[]'
            }

            if ($endpoint -eq "repos/mock-owner/mock-repo/rulesets/123") {
              if ($arguments -contains "--method") {
                $methodIndex = [Array]::IndexOf($arguments, "--method")
                $method = [string]$arguments[$methodIndex + 1]

                if ($method -eq "PUT") {
                  $global:MockPutCount++
                  return '{"id":123,"name":"Protect main","enforcement":"active"}'
                }
              }
            }

            throw "Unexpected gh call: $($arguments -join ' ')"
          }

          & .\scripts\setup-github.ps1 -Repository "mock-owner/mock-repo"

          if (-not $global:MockRulesetExists) {
            throw "First run did not create the Ruleset."
          }
          if ($global:MockPostCount -ne 1) {
            throw "First run must create exactly one Ruleset."
          }
          if ($global:MockPutCount -ne 0) {
            throw "First run must not update an existing Ruleset."
          }

          & .\scripts\setup-github.ps1 -Repository "mock-owner/mock-repo"

          if ($global:MockPostCount -ne 1) {
            throw "Second run created a duplicate Ruleset."
          }
          if ($global:MockPutCount -ne 1) {
            throw "Second run did not update the existing Ruleset exactly once."
          }
